$schema: "http://json-schema.org/draft-07/schema#"
title: OCUDU pinned releases
description: Tagged OCUDU releases that the report always keeps available
type: object
required:
  - releases
additionalProperties: false
properties:
  releases:
    type: array
    items:
      type: object
      required:
        - name
        - tag
        - ocudu_commit
      additionalProperties: false
      properties:
        name:
          type: string
          description: Release name as used in features.yaml (e.g. "26.04 (v1.0)")
          minLength: 1
        tag:
          type: string
          description: Git tag in ocudu/ocudu (e.g. release_26_04)
          minLength: 1
        ocudu_commit:
          type: string
          description: Full 40-character SHA the tag points to
          pattern: "^[0-9a-f]{40}$"
